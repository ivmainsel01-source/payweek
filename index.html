<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAY WEEK ACTIVITY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: 'JetBrains Mono', monospace;
    }

    #cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: #ff6b00;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      box-shadow: 0 0 6px 2px rgba(255,107,0,0.6);
      transition: transform 0.05s;
    }

    #lantern-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    #letters-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .letter {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.4rem;
      opacity: 0;
      transition: opacity 0.25s;
      user-select: none;
      pointer-events: none;
    }
    .letter.target  { color: #ff6b00; }
    .letter.decoy   { color: #ffffff; }

    #top-hint {
      position: fixed;
      top: calc(50% - 80px);
      left: 0; right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: #ff6b00;
      letter-spacing: 0.12em;
      z-index: 10;
      opacity: 0.85;
    }

    #center-ui {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #input-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    #secret-input {
      width: 160px;
      background: #000;
      border: 1.5px solid #ff6b00;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 6px 8px;
      outline: none;
      caret-color: #ff6b00;
      letter-spacing: 0.05em;
      text-align: center;
    }
    #secret-input::placeholder { color: #555; }
    #secret-input:focus { box-shadow: 0 0 8px rgba(255,107,0,0.4); }

    #submit-btn {
      width: 160px;
      background: #ff6b00;
      border: none;
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      padding: 10px 0;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #submit-btn:hover { background: #ff8c33; box-shadow: 0 0 12px rgba(255,107,0,0.5); }

    #error-msg {
      margin-top: 6px;
      color: #ff3333;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      min-height: 1em;
      font-family: 'JetBrains Mono', monospace;
    }

    #reveal-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow-y: auto;
    }
    #reveal-screen.active { display: flex; }

    #reveal-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.6rem, 5vw, 3rem);
      color: #ff6b00;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255,107,0,0.6);
    }

    #reveal-subtitle {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.2em;
      margin-bottom: 36px;
      text-transform: uppercase;
    }

    #cards-row {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .info-card {
      border: 1px solid #ff6b00;
      padding: 20px 24px;
      min-width: 140px;
      text-align: center;
      position: relative;
      background: #000;
    }
    .info-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,107,0,0.04);
      pointer-events: none;
    }

    .card-label {
      font-size: 0.6rem;
      color: #ff6b00;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .card-value small {
      display: block;
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 4px;
      font-weight: 400;
    }

    #confirm-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    #name-label {
      font-size: 0.65rem;
      color: #ff6b00;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #name-input {
      width: 240px;
      background: #000;
      border: 1.5px solid #ff6b00;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 6px 8px;
      outline: none;
      caret-color: #ff6b00;
      letter-spacing: 0.05em;
    }
    #name-input::placeholder { color: #444; }
    #name-input:focus { box-shadow: 0 0 8px rgba(255,107,0,0.4); }

    #confirm-btn {
      width: 240px;
      background: #ff6b00;
      border: none;
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      padding: 3px 0;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #confirm-btn:hover { background: #ff8c33; box-shadow: 0 0 12px rgba(255,107,0,0.5); }

    #confirm-note {
      margin-top: 14px;
      font-size: 0.62rem;
      color: #555;
      letter-spacing: 0.1em;
    }
    #confirm-note span { color: #ff6b00; }

    #confirm-success {
      display: none;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #00cc66;
      letter-spacing: 0.1em;
    }

    #reveal-screen::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,107,0,0.015) 2px,
        rgba(255,107,0,0.015) 4px
      );
      pointer-events: none;
      z-index: 0;
    }
    #reveal-screen > * { position: relative; z-index: 1; }
  </style>
</head>
<body>

<div id="cursor"></div>
<canvas id="lantern-canvas"></canvas>
<div id="letters-layer"></div>

<div id="center-ui">
  <div id="input-box">
    <input id="secret-input" type="text" placeholder="palavra-chave" autocomplete="off" spellcheck="false" />
    <button id="submit-btn">Entrar</button>
    <div id="error-msg"></div>
  </div>
</div>

  <div id="reveal-subtitle">// acesso concedido</div>

    </div>
    <div class="info-card">
      <div class="card-label">Hora</div>
      <div class="card-value">15h<small>&nbsp;</small></div>
