<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAY WEEK ACTIVITY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Custom cursor (desktop only) ── */
    #cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: #ff6b00;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      box-shadow: 0 0 6px 2px rgba(255,107,0,0.6);
      transition: transform 0.05s;
      display: none;
    }

    /* ── Lantern canvas ── */
    #lantern-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Letters layer ── */
    #letters-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .letter {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.25s;
      user-select: none;
      pointer-events: none;
    }
    .letter.target  { color: #ff6b00; }
    .letter.decoy   { color: #ffffff; }

    /* ── Top hint ── */
    #top-hint {
      position: fixed;
      left: 0; right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 3.5vw, 1rem);
      color: #ff6b00;
      letter-spacing: 0.08em;
      z-index: 10;
      opacity: 0.85;
      padding: 0 16px;
    }

    /* ── Center UI ── */
    #center-ui {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #input-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    #secret-input {
      width: min(80vw, 280px);
      background: #000;
      border: 1.5px solid #ff6b00;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.9rem, 4vw, 1rem);
      padding: 10px 8px;
      outline: none;
      caret-color: #ff6b00;
      letter-spacing: 0.05em;
      text-align: center;
      -webkit-appearance: none;
    }
    #secret-input::placeholder { color: #555; }
    #secret-input:focus { box-shadow: 0 0 8px rgba(255,107,0,0.4); }

    #submit-btn {
      width: min(80vw, 280px);
      background: #ff6b00;
      border: none;
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: clamp(0.8rem, 3.5vw, 0.9rem);
      letter-spacing: 0.08em;
      padding: 14px 0;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #submit-btn:hover, #submit-btn:active { background: #ff8c33; box-shadow: 0 0 12px rgba(255,107,0,0.5); }

    #error-msg {
      margin-top: 8px;
      color: #ff3333;
      font-size: clamp(0.65rem, 3vw, 0.75rem);
      letter-spacing: 0.05em;
      min-height: 1em;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Reveal screen ── */
    #reveal-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 40px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #reveal-screen.active { display: flex; }

    #reveal-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 6vw, 3rem);
      color: #ff6b00;
      letter-spacing: clamp(0.05em, 2vw, 0.15em);
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255,107,0,0.6);
      text-align: center;
    }

    #reveal-subtitle {
      font-size: clamp(0.6rem, 2.5vw, 0.7rem);
      color: #00cc66;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    #reveal-desc {
      font-size: clamp(0.72rem, 3vw, 0.78rem);
      color: #aaa;
      letter-spacing: 0.05em;
      margin-bottom: 28px;
      text-align: center;
      max-width: 520px;
      line-height: 1.7;
      padding: 0 8px;
    }

    #cards-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .info-card {
      border: 1px solid #ff6b00;
      padding: 16px 20px;
      min-width: 100px;
      flex: 1 1 90px;
      max-width: 180px;
      text-align: center;
      position: relative;
      background: #000;
    }
    .info-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,107,0,0.04);
      pointer-events: none;
    }

    .card-label {
      font-size: clamp(0.55rem, 2.5vw, 0.6rem);
      color: #ff6b00;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .card-value small {
      display: block;
      font-size: clamp(0.6rem, 2.5vw, 0.65rem);
      color: #aaa;
      margin-top: 4px;
      font-weight: 400;
    }

    #confirm-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    #form-wrapper {
      border: none;
      background: #000;
      overflow: hidden;
      width: min(420px, 95vw);
    }

    #form-wrapper iframe {
      width: 100%;
      height: 380px;
      border: none;
      display: block;
      filter: invert(1) hue-rotate(180deg) brightness(0.85);
    }

    #confirm-note {
      margin-top: 14px;
      font-size: clamp(0.58rem, 2.5vw, 0.62rem);
      color: #555;
      letter-spacing: 0.1em;
      text-align: center;
    }
    #confirm-note span { color: #ff6b00; }

    /* scanline overlay */
    #reveal-screen::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,107,0,0.015) 2px,
        rgba(255,107,0,0.015) 4px
      );
      pointer-events: none;
      z-index: 0;
    }
    #reveal-screen > * { position: relative; z-index: 1; }

    /* ── Touch ripple indicator ── */
    #touch-indicator {
      position: fixed;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(255,107,0,0.4);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #touch-indicator.active { opacity: 1; }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="touch-indicator"></div>
<canvas id="lantern-canvas"></canvas>
<div id="letters-layer"></div>

<div id="top-hint">Será que consegues descobrir a primeira pista?</div>

<div id="center-ui">
  <div id="input-box">
    <input id="secret-input" type="text" placeholder="palavra-chave" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" />
    <button id="submit-btn">Entrar</button>
    <div id="error-msg"></div>
  </div>
</div>

<div id="reveal-screen">
  <div id="reveal-title">PAY WEEK ACTIVITY</div>
  <div id="reveal-subtitle">// acesso concedido</div>
  <div id="reveal-desc">Estamos a testar o teu espírito de descoberta,<br>estás pronto para o desafio?</div>

  <div id="cards-row">
    <div class="info-card">
      <div class="card-label">Lugar</div>
      <div class="card-value">A descobrir<small>&nbsp;</small></div>
    </div>
    <div class="info-card">
      <div class="card-label">Hora</div>
      <div class="card-value">15h<small>&nbsp;</small></div>
    </div>
    <div class="info-card">
      <div class="card-label">Dia</div>
      <div class="card-value">27 Jun<small>Sábado</small></div>
    </div>
  </div>

  <div id="confirm-block">
    <div id="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeJcW9xKLrDTFpFTMjLzAj6N5CwYZG5EHtdrX5Wvpvne9zh7w/viewform?embedded=true" loading="lazy">A carregar…</iframe>
    </div>
    <div id="confirm-note">Confirmação até <span>19 de junho</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── Input / cursor / top-hint positioning ── */
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const cursor   = document.getElementById('cursor');
  const touchInd = document.getElementById('touch-indicator');
  const topHint  = document.getElementById('top-hint');

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;

  /* Position top-hint just above the input area */
  function positionHint() {
    const cy = window.innerHeight / 2;
    topHint.style.top = (cy - 80) + 'px';
  }
  positionHint();

  if (!isTouch) {
    cursor.style.display = 'block';
    document.body.style.cursor = 'none';
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
    });
  } else {
    document.body.style.cursor = 'default';
  }

  /* ── Lantern canvas ── */
  const canvas = document.getElementById('lantern-canvas');
  const ctx    = canvas.getContext('2d');
  const RADIUS = 130;

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawLantern() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,0,0,0.97)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const grad = ctx.createRadialGradient(mx, my, 0, mx, my, RADIUS);
    grad.addColorStop(0,    'rgba(0,0,0,0)');
    grad.addColorStop(0.55, 'rgba(0,0,0,0)');
    grad.addColorStop(1,    'rgba(0,0,0,0.97)');

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ── Touch lantern ── */
  let touchActive = false;
  let touchTimeout = null;

  if (isTouch) {
    canvas.style.pointerEvents = 'none';

    document.addEventListener('touchstart', e => {
      const t = e.touches[0];
      mx = t.clientX; my = t.clientY;
      touchInd.style.left = mx + 'px';
      touchInd.style.top  = my + 'px';
      touchInd.classList.add('active');
      touchActive = true;
      clearTimeout(touchTimeout);
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      const t = e.touches[0];
      mx = t.clientX; my = t.clientY;
      touchInd.style.left = mx + 'px';
      touchInd.style.top  = my + 'px';
    }, { passive: true });

    document.addEventListener('touchend', () => {
      touchTimeout = setTimeout(() => {
        touchInd.classList.remove('active');
        touchActive = false;
        /* fade lantern back to center */
        mx = window.innerWidth / 2;
        my = window.innerHeight / 2;
      }, 1500);
    }, { passive: true });
  }

  /* ── Letters ── */
  const layer   = document.getElementById('letters-layer');
  const TARGET  = 'DESCOBERTA';
  const DECOYS  = 'ABCDFGHIJKLMNOPQRSTUVXZWYÇ1234567890!?@#';
  const letters = [];

  function randBetween(a, b) { return a + Math.random() * (b - a); }

  function spawnLetters() {
    const vw  = window.innerWidth;
    const vh  = window.innerHeight;
    const pad = vw < 480 ? 20 : 40;
    const cx  = vw / 2;
    const cy  = vh / 2;

    /* Adaptive grid: fewer columns on narrow screens */
    const cols = vw < 480 ? 8 : (vw < 768 ? 10 : 16);
    const rows = vw < 480 ? 12 : 10;
    const TOTAL = vw < 480 ? 80 : (vw < 768 ? 110 : 160);

    const cellW = (vw - pad * 2) / cols;
    const cellH = (vh - pad * 2) / rows;

    /* Input element actual width for protection zone */
    const inputEl = document.getElementById('secret-input');
    const inputW  = inputEl ? inputEl.offsetWidth + 40 : 200;

    const phraseTop    = cy - 115;
    const phraseBottom = cy - 45;
    const inputTop     = cy - 45;
    const inputBottom  = cy + 120;
    const inputLeft    = cx - inputW / 2;
    const inputRight   = cx + inputW / 2;

    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cx2 = pad + c * cellW + cellW / 2;
        const cy2 = pad + r * cellH + cellH / 2;
        const inPhrase = cy2 > phraseTop  && cy2 < phraseBottom;
        const inInput  = cx2 > inputLeft  && cx2 < inputRight && cy2 >= inputTop && cy2 < inputBottom;
        if (!inPhrase && !inInput) cells.push({ cx: cx2, cy: cy2 });
      }
    }

    for (let i = cells.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cells[i], cells[j]] = [cells[j], cells[i]];
    }

    const minFontRem = vw < 480 ? 1.0 : 1.4;
    const maxFontRem = vw < 480 ? 2.0 : 3.2;

    const count = Math.min(TOTAL, cells.length);
    for (let i = 0; i < count; i++) {
      const cell = cells[i];
      const x = cell.cx + randBetween(-cellW * 0.25, cellW * 0.25);
      const y = cell.cy + randBetween(-cellH * 0.25, cellH * 0.25);

      const isTarget = i < TARGET.length;
      const char     = isTarget
        ? TARGET[i]
        : DECOYS[Math.floor(Math.random() * DECOYS.length)];

      const el = document.createElement('span');
      el.classList.add('letter', isTarget ? 'target' : 'decoy');
      el.textContent = char;
      el.style.left      = x + 'px';
      el.style.top       = y + 'px';
      el.style.fontSize  = randBetween(minFontRem, maxFontRem) + 'rem';
      el.style.transform = `rotate(${randBetween(-40, 40)}deg)`;
      layer.appendChild(el);
      letters.push({ el, x, y });
    }
  }
  spawnLetters();

  function updateLetterVisibility() {
    const r2 = RADIUS * RADIUS;
    letters.forEach(({ el, x, y }) => {
      const dx = x - mx, dy = y - my;
      el.style.opacity = (dx * dx + dy * dy < r2) ? '1' : '0';
    });
  }

  /* ── Main loop ── */
  function loop() {
    drawLantern();
    updateLetterVisibility();
    requestAnimationFrame(loop);
  }
  loop();

  /* ── Input logic ── */
  const input  = document.getElementById('secret-input');
  const btn    = document.getElementById('submit-btn');
  const errMsg = document.getElementById('error-msg');
  const reveal = document.getElementById('reveal-screen');

  function attempt() {
    const val = input.value.trim().toLowerCase();
    if (val === 'descoberta') {
      errMsg.textContent = '';
      reveal.classList.add('active');
      if (!isTouch) {
        document.body.style.cursor = 'default';
        cursor.style.display = 'none';
      }
    } else {
      errMsg.textContent = '// acesso negado';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

  /* ── Resize: respawn letters ── */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      positionHint();
      letters.forEach(({ el }) => el.remove());
      letters.length = 0;
      spawnLetters();
    }, 200);
  });
})();
</script>
</body>
</html>
